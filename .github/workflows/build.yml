          #!/bin/sh
          # Register the settings app on the home screen
          if [ -x /var/jb/usr/bin/uicache ]; then
            /var/jb/usr/bin/uicache -p /var/jb/Applications/DynIslandPrefs.app 2>/dev/null || /var/jb/usr/bin/uicache -a 2>/dev/null
