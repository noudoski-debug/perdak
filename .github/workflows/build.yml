          chmod 755 layout/DEBIAN/postinst

          cat > icon.py <<'EOF'
          import zlib, struct, math

          def png(path, n):
              rows = []
              for y in range(n):
                  row = bytearray([0])
                  for x in range(n):
                      u, v = x / n, y / n
                      # blue-violet gradient background
                      r = 40 + 70 * u * (1 - v) + 20 * v
                      g = 70 + 100 * (1 - v) * (1 - 0.5 * u)
                      b = 170 + 70 * (1 - u * 0.6)
                      # black capsule (the "island")
                      cx, cy, hw, hh = 0.5, 0.30, 0.27, 0.075
                      px = max(abs(u - cx) - (hw - hh), 0)
                      d = math.hypot(px, v - cy) - hh
                      cov = max(0.0, min(1.0, 0.5 - d * n))
                      ring = max(0.0, 1.0 - abs(d * n + 0.7) / 1.4) * 0.35 * (1 - v)
                      r = r * (1 - cov) + 8 * cov
                      g = g * (1 - cov) + 8 * cov
                      b = b * (1 - cov) + 10 * cov
                      r += (255 - r) * ring
                      g += (255 - g) * ring
                      b += (255 - b) * ring
                      row += bytes([int(min(255, r)), int(min(255, g)), int(min(255, b))])
                  rows.append(bytes(row))
              raw = b"".join(rows)
              def chunk(t, d):
                  c = struct.pack(">I", len(d)) + t + d
                  return c + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
              data = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", n, n, 8, 2, 0, 0, 0)) \
                  + chunk(b"IDAT", zlib.compress(raw, 9)) + chunk(b"IEND", b"")
              open(path, "wb").write(data)

          png("app/Resources/AppIcon60x60@2x.png", 120)
          png("app/Resources/AppIcon60x60@3x.png", 180)
          EOF

