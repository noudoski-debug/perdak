<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EncoreDLC — Access</title>
<style>
:root{color-scheme:dark;--bg:#090b12;--panel:#111522;--line:#272d42;--muted:#8c96b4;--text:#f3f5ff;--accent:#9a7bff;--accent2:#5de1c3}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#27204a 0,transparent 45%),var(--bg);font:15px Inter,system-ui,sans-serif;color:var(--text);display:grid;place-items:center;padding:22px}
.card{width:min(100%,390px);background:linear-gradient(160deg,#151a2a,#0e111b);border:1px solid #30364e;border-radius:26px;padding:28px;box-shadow:0 30px 100px #0009}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}.logo{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,var(--accent),#5b4bd8);display:grid;place-items:center;font-weight:900;font-size:21px;box-shadow:0 8px 30px #8266ff55}.brand b{font-size:20px;letter-spacing:.5px}.brand small{display:block;color:var(--muted);margin-top:3px}.eyebrow{color:var(--accent2);font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:800}.title{font-size:28px;margin:8px 0}.sub{color:var(--muted);line-height:1.5;margin:0 0 22px}
.field{display:flex;gap:8px;background:#090c14;border:1px solid var(--line);padding:7px;border-radius:14px}.field input{width:100%;min-width:0;background:transparent;border:0;outline:0;color:white;padding:10px;font-size:16px;letter-spacing:1px}.field button{border:0;border-radius:10px;background:#252b40;color:#dfe3ff;padding:0 12px;cursor:pointer}
.keys{display:grid;grid-template-columns:repeat(3, minmax(0, 72px));justify-content:center;gap:5px;margin:10px auto 0;max-width:226px}.key{height:32px;background:#191e2e;border:1px solid #2a3045;color:#e9eaff;border-radius:11px;font-size:14px;cursor:pointer}.key:active{transform:scale(.97);background:#302957}.key.alt{color:#c2b6ff}.actions{display:flex;gap:10px;margin-top:15px}.submit{flex:1;border:0;border-radius:13px;background:linear-gradient(100deg,#9a7bff,#6b62e8);color:white;font-weight:800;padding:14px;cursor:pointer}.clear{border:1px solid var(--line);border-radius:13px;background:#171b29;color:#c9cee2;padding:0 16px;cursor:pointer}.status{min-height:22px;margin-top:15px;color:var(--muted);font-size:13px}.foot{display:flex;justify-content:space-between;border-top:1px solid #252a3c;padding-top:17px;margin-top:16px;color:#707b99;font-size:11px}
</style>
</head>
<body><main class="card">
<div class="brand"><div class="logo">E</div><div><b>EncoreDLC</b><small>LICENSE PORTAL · v1.0</small></div></div>
<div class="eyebrow">SECURE ACCESS</div><h1 class="title">Enter your key</h1><p class="sub">Введите лицензионный ключ, чтобы проверить доступ к приложению.</p>
<div class="field"><input id="license" placeholder="Например, 123456" autocomplete="off" inputmode="numeric" pattern="[0-9]*" maxlength="12" aria-label="Цифровой лицензионный ключ"><button id="back" title="Удалить символ">⌫</button></div>
<div class="keys" id="keyboard"></div>
<div class="actions"><button class="submit" id="check">ПРОВЕРИТЬ КЛЮЧ</button><button class="clear" id="clear">Очистить</button></div>
<div class="status" id="status">Введите цифровой ключ. Для проверки нужно подключение к серверу.</div>
<div class="foot"><span>ENCORE DLC</span><span>LICENSE CHECK</span></div>
</main>
<script>
const input=document.querySelector('#license'), status=document.querySelector('#status');
const kb=document.querySelector('#keyboard');
const digits=['1','2','3','4','5','6','7','8','9','⌫','0','C'];
function setStatus(message, kind='muted') {
  status.textContent=message;
  status.style.color=kind==='good'?'#5de1c3':kind==='bad'?'#ff8d9a':'#8c96b4';
}
function normalize(){ input.value=input.value.replace(/\D/g,'').slice(0,12); }
input.addEventListener('input',normalize);
input.addEventListener('paste',()=>setTimeout(normalize,0));
digits.forEach(ch=>{
  const b=document.createElement('button'); b.type='button';
  b.className='key'+(ch==='⌫'||ch==='C'?' alt':'');
  b.textContent=ch==='C'?'Очистить':ch; b.setAttribute('aria-label',ch==='⌫'?'Удалить последнюю цифру':ch==='C'?'Очистить':'Цифра '+ch);
  b.onclick=()=>{
    if(ch==='⌫') input.value=input.value.slice(0,-1);
    else if(ch==='C') input.value='';
    else if(input.value.length<12) input.value+=ch;
    setStatus('Ключ готов к проверке.');
  };
  kb.appendChild(b);
});
document.querySelector('#back').onclick=()=>{input.value=input.value.slice(0,-1);input.focus()};
document.querySelector('#clear').onclick=()=>{input.value='';setStatus('Введите цифровой ключ.')};
let checking=false;
document.querySelector('#check').onclick=async()=>{
  normalize(); const key=input.value.trim();
  if(checking)return;
  if(!/^\d{1,12}$/.test(key)){setStatus('Ключ должен содержать только цифры (до 12).','bad');return}
  checking=true; const button=document.querySelector('#check');button.disabled=true;button.textContent='ПРОВЕРЯЕМ…';
  setStatus('Отправляем запрос серверу…');
  try {
    const r=await fetch('/api/v1/license/check',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},cache:'no-store',body:JSON.stringify({key})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.detail||('HTTP '+r.status));
    if(d.valid){
      const until=d.expires_at?(' · до '+new Date(d.expires_at).toLocaleString()):' · без срока';
      setStatus('Ключ действителен'+until+'. Активация выполняется в официальном клиенте.','good');
    } else {
      const reasons={invalid_key:'Ключ не найден.',revoked:'Ключ отозван.',expired:'Срок действия ключа истёк.',invalid_format:'Используйте только цифры.'};
      setStatus(reasons[d.reason]||('Проверка не пройдена: '+(d.reason||'неизвестная ошибка')),'bad');
    }
  } catch(e){setStatus('Не удалось связаться с сервером: '+(e.message||'ошибка сети'),'bad')}
  finally{checking=false;button.disabled=false;button.textContent='ПРОВЕРИТЬ КЛЮЧ'}
};
input.addEventListener('keydown',e=>{if(e.key==='Enter')document.querySelector('#check').click()});
</script></body></html>
